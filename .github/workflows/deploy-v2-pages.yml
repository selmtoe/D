name: deploy v2 web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type deploy-v2 after Firebase owner checks are complete"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'deploy-v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daifugo/rules build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @daifugo/web build
        env:
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for legacy branch-source Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const api = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const discoveryDeadline = Date.now() + 30_000;
          const completionDeadline = Date.now() + 180_000;
          let legacyDeployment;

          while (Date.now() < completionDeadline) {
            const deployments = await fetch(
              `${api}/deployments?sha=${process.env.REVISION}&environment=github-pages&per_page=20`,
              { headers },
            ).then((response) => {
              if (!response.ok) throw new Error(`deployments API returned ${response.status}`);
              return response.json();
            });
            legacyDeployment = deployments.find(
              (deployment) => deployment.performed_via_github_app?.slug === "github-pages",
            );

            if (!legacyDeployment) {
              if (Date.now() >= discoveryDeadline) {
                console.log("No branch-source deployment detected; continuing with Actions Pages.");
                process.exit(0);
              }
            } else {
              const statuses = await fetch(legacyDeployment.statuses_url, { headers }).then(
                (response) => {
                  if (!response.ok) throw new Error(`deployment status API returned ${response.status}`);
                  return response.json();
                },
              );
              const state = statuses[0]?.state;
              console.log(`Branch-source deployment ${legacyDeployment.id}: ${state ?? "pending"}`);
              if (["success", "inactive", "failure", "error"].includes(state)) process.exit(0);
            }

            await new Promise((resolve) => setTimeout(resolve, 5_000));
          }

          throw new Error(
            `Timed out waiting for branch-source deployment ${legacyDeployment?.id ?? "discovery"}.`,
          );
          NODE
      - name: Deploy v2 web
        id: deployment
        uses: actions/deploy-pages@v4
